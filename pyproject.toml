[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-atlas"
version = "0.1.0"
description = "Generated research atlas and projection-health observatory for Ordivon"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ordivon-atlas = "ordivon_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
