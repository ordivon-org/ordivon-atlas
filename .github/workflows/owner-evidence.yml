name: Atlas owner evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  owner-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Record bounded A1 evidence identity
        shell: bash
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf 'evidence_stage=A1-owner-portability\n'
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'github_sha=%s\n' "$GITHUB_SHA"
          printf 'checkout_head=%s\n' "$(git rev-parse HEAD)"
          printf 'candidate_head_sha=%s\n' "${CANDIDATE_HEAD_SHA:-}"
          printf 'base_sha=%s\n' "${BASE_SHA:-}"
          printf 'head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
          printf 'base_ref=%s\n' "${GITHUB_BASE_REF:-}"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
          python --version
          uv --version
          sha256sum \
            .github/workflows/owner-evidence.yml \
            scripts/owner-environment \
            pyproject.toml \
            uv.lock
      - name: Prove Workstation owner topology is absent
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /root/projects/ordivon-atlas \
            /root/projects/ordivon-host \
            /root/projects/ordivon-world \
            /root/workstation-lab; do
            test ! -e "$path"
          done
          printf 'foreign_owner_topology_absent=yes\n'
      - name: Reproduce owner-native offline cold-start gate
        run: scripts/owner-environment cold-start
